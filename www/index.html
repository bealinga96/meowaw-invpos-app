<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MeowAw Pet Supplies POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf5ef;--card:#fff;--ink:#2b1a0c;--mut:#7a6552;--line:#ecdfd2;--pri:#e8590c;--pri2:#c94a06;--sun:#704214;--side:#46290e;--danger:#c62f3b;--tile:#fffaf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a120a;--card:#2a1d12;--ink:#f6ebdf;--mut:#b9a48f;--line:#443121;--side:#120b05;--tile:#33241a;--sun:#a8722f}}
:root[data-theme="dark"]{--bg:#1a120a;--card:#2a1d12;--ink:#f6ebdf;--mut:#b9a48f;--line:#443121;--side:#120b05;--tile:#33241a;--sun:#a8722f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.btn:hover{background:var(--pri2)}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.dan{background:var(--danger)}.btn.sm{padding:5px 10px;font-size:13px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--side) 55%,var(--pri) 55%)}
.lbox{background:var(--card);border-radius:22px;padding:28px;width:min(390px,100%);box-shadow:0 20px 50px #0005}
.lbox{text-align:center}.lbox label{text-align:left}.lbox .logo{background:#fff;border-radius:12px;display:block;width:min(320px,100%);height:auto;margin:0 auto 4px}.lbox h1{font-size:20px;margin:0 0 10px;color:var(--sun)}.lg{display:block;height:auto}.brand{background:#fff;border-radius:12px;padding:6px 8px;justify-content:center}.brand .full{width:100%}.brand .mini{display:none;width:34px}aside.col .brand .full{display:none}aside.col .brand .mini{display:block}
.err{color:var(--danger);font-weight:700;min-height:20px;margin:8px 0 0}
/* shell */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#app[hidden],#login[hidden]{display:none}
aside{background:var(--side);color:#f6ebdf;width:220px;flex:none;display:flex;flex-direction:column;padding:12px 10px;transition:width .2s;z-index:20}
.brand{font-size:20px;display:flex;align-items:center;gap:10px;padding:6px;white-space:nowrap;overflow:hidden}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto}
.nav button{background:none;border:0;color:inherit;display:flex;gap:12px;align-items:center;text-align:left;padding:9px 12px;border-radius:10px;white-space:nowrap;overflow:hidden;font-weight:600}
.nav button:hover{background:#ffffff18}.nav button.on{background:var(--pri);color:#fff}
.nav .ic{font-size:19px;width:24px;text-align:center;flex:none}
aside.col{width:64px}aside.col .lb{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h2{font-size:22px;flex:1}
.ham{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;min-height:0}
.scrim{display:none}.foot{text-align:center;font-size:12px;line-height:1.5;color:var(--mut);padding:8px 12px;border-top:1px solid var(--line);flex:none}.lbox .foot{margin:18px -8px 0;padding:12px 0 0}
@media (max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:230px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 aside.col{width:230px}aside.col .lb{display:inline}
 aside.open{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:#0007;z-index:15}
}
/* pos */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px;height:100%}
.pl{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}.cats{min-width:0;max-width:100%}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.cats button.on{background:var(--sun);border-color:var(--sun);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;overflow:auto;align-content:start;flex:1;min-height:0}
.tile{position:relative;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.tile:hover{border-color:var(--pri)}.tile[disabled]{opacity:.45}
.tile .em{font-size:38px;line-height:1.1}.tile b{font-size:13px}.tile small{color:var(--mut)}
.tile .qb{position:absolute;top:6px;right:6px;background:var(--pri);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:grid;place-items:center}
.cart{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart h3{padding:10px 14px;border-bottom:1px solid var(--line);font-size:18px}
.lines{flex:1;overflow:auto;padding:4px 14px;min-height:80px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ln .n{flex:1;min-width:0}.ln .n small{display:block;color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:none}
.tots{padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.tots div{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.tots .g{font-size:20px;font-weight:800;font-family:"Baloo 2",sans-serif}
.tots input{width:90px;padding:4px 8px;text-align:right}
.act{display:flex;gap:8px;padding:10px 14px 14px}.act .btn{flex:1;padding:12px}
.act .charge{background:var(--sun);color:#fff}.act .charge:hover{background:var(--side)}
@media (max-width:900px) and (orientation:portrait),(max-width:700px){.pos{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(240px,1fr) auto;height:auto;min-height:100%}.grid{max-height:44vh}.cart{max-height:none}.lines{max-height:220px}}
/* pages */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-left:6px solid var(--pri)}
.stat:nth-child(2){border-left-color:var(--sun)}.stat:nth-child(3){border-left-color:#46290e}.stat:nth-child(4){border-left-color:var(--danger)}
.stat small{color:var(--mut);font-weight:700}.stat div{font:800 24px "Baloo 2",sans-serif}
.panel{max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.panel h3{font-size:18px;margin-bottom:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:13px}td.r,th.r{text-align:right}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.two>*,.panel,.stat{min-width:0}@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.low{color:var(--danger);font-weight:800}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:16px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.md .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;position:sticky;bottom:-20px;background:var(--card);padding:12px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700}
@media (max-width:480px){#dt{display:none}.top h2{font-size:19px}.page{padding:12px}}
.stat div{font-size:clamp(18px,3vw,24px);overflow-wrap:anywhere}.top h2{min-width:0}
.sub{display:none;flex-direction:column;gap:2px;margin-left:16px}.sub.open{display:flex}.sub button{padding:8px 12px!important;font-size:14px}.nav .grp.on{background:#ffffff22}.grp .car{margin-left:auto;transition:transform .2s}.grp+.sub.open{}aside.col .sub{display:none!important}.chk label{font-weight:400;display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}.chk input{width:auto}.chk{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#e9e1d8;color:#3d2a17}.bd.ok{background:#dff3e4;color:#1d6b34}.bd.warn{background:#fff0c9;color:#7a5200}.bd.bad{background:#fbdde0;color:#a1212d}
@media print{aside,.scrim,.top,.foot,.noprint,.toast{display:none!important}
html,body{height:auto!important;background:#fff!important;color:#000!important}
#app{display:block!important;height:auto!important;overflow:visible!important}
main{display:block!important}.page{overflow:visible!important;padding:0!important}
.tw{max-height:none!important;overflow:visible!important}table{min-width:0}th,td{white-space:normal;padding:5px 6px;font-size:12px}
.panel,.stat{break-inside:avoid;border-color:#bbb!important}.two{grid-template-columns:1fr!important}.prh{display:block!important}
:root:not([data-theme="x"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#ccc;--tile:#fff}}
.prh{display:none;margin-bottom:10px}.prh h2{font-size:22px}.prh p{margin:2px 0 0;color:#444}
</style></head><body>

 pets:{add:'Add pet',def:()=>({species:'Dog',member:'',vax:[],vaxOther:''}),
  cols:[['Owner',r=>esc(r.oname)],['Pet name',r=>'<b>'+esc(r.name)+'</b>'],['Contact number',r=>esc(r.tel)],['Breed',r=>esc(r.breed)]],
  fields:[['member','Owner is a member?','select',()=>[['','No, walk-in'],...S.members.map(m=>[m.id,m.name])],0,1],['oname','Owner name','text',null,1],['tel','Contact number','tel'],['name','Pet name','text',null,1],['species','Species','select',[['Dog','Dog'],['Cat','Cat'],['Other','Other']]],['breed','Breed','text'],VF,VO],pre:vpre,post:vpost,
  after:o=>{const m=o.querySelector('#cf_member');m.onchange=()=>{const x=S.members.find(y=>y.id==m.value);if(x){o.querySelector('#cf_oname').value=x.name;o.querySelector('#cf_tel').value=x.tel}};
   const sp=o.querySelector('#cf_species'),box=o.querySelector('#cf_vax');sp.onchange=()=>{const cur=[...box.querySelectorAll('input:checked')].map(i=>i.value),list=[...new Set([...vaxFor(sp.value),...cur])];box.innerHTML=list.map(x=>`<label><input type="checkbox" value="${esc(x)}" ${cur.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}},
  text:r=>r.oname+r.name+r.tel+r.breed,sort:(a,b)=>(a.oname||'').localeCompare(b.oname||'')},
 appt:{add:'Add appointment',def:()=>({date:today(),time:'09:00',status:'Scheduled',services:[]}),
  cols:[['Owner',r=>po(r.pet,'oname')],['Pet name',r=>po(r.pet,'name')],['Contact number',r=>po(r.pet,'tel')],['Breed',r=>po(r.pet,'breed')],['Services availed',r=>`<div style="white-space:normal;min-width:210px">${esc((r.services||[]).join(', ')||'—')}<br><small>${muted(fd(r.date)+' '+esc(r.time||'')+(r.until?' · until '+fd(r.until):''))}</small> ${bd(r.status,APST[r.status])}</div>`]],
  fields:[['pet','Pet (owner)','select',petOpts,1,1],['services','Services availed','checks',v=>[...new Set([...svcAll(),...(v.services||[])])].map(x=>[x,x]),1],['date','Appointment date','date',null,1],['time','Time','time'],['until','Boarding check-out date (if boarding)','date'],['status','Status','select',['Scheduled','Completed','Cancelled'].map(x=>[x,x])],['notes','Notes','text']],
  acts:[['Cancel appointment',r=>{if(r.status==='Cancelled'){toast('Already cancelled');return true}modal('<h3>Cancel this appointment?</h3><p>It stays in the list marked as Cancelled. You can reinstate it from Edit.</p>',()=>{r.status='Cancelled';save();tbl()},'Cancel appointment');return true}]],nodel:1,
  text:r=>pt(r.pet)+(r.services||[]).join(' ')+r.status,
  sort:(a,b)=>{const t=today(),x=a.date>=t?0:1,y=b.date>=t?0:1;return x-y||(x?b.date.localeCompare(a.date):(a.date+a.time).localeCompare(b.date+b.time))}},
 vax:{src:'pets',noadd:1,nodel:1,edit:'Update vaccines',mt:r=>'Vaccines: '+r.name,note:'This list syncs with Pet Profile. Add a pet there and it appears here automatically.',
  cols:[['Owner',r=>esc(r.oname)],['Pet name',r=>'<b>'+esc(r.name)+'</b>'],['Contact number',r=>esc(r.tel)],['Breed',r=>esc(r.breed)],['Vaccines already received',r=>`<div style="white-space:normal;min-width:220px">${(r.vax||[]).map(x=>bd(x,'ok')).join(' ')||muted('None recorded')}</div>`]],
  fields:[VF,VO],pre:vpre,post:vpost,
  text:r=>r.oname+r.name+r.breed+(r.vax||[]).join(' '),sort:(a,b)=>(a.oname||'').localeCompare(b.oname||'')}
};
let CK='';
function crud(k){CK=k;const c=CFG[k];$('#pg').innerHTML=(k!=='pets'&&!S.pets.length?'<div class="panel">Add a pet in Pet Profile first, then come back here.</div>':'')+(c.note?`<p style="color:var(--mut);margin:0 0 10px">${c.note}</p>`:'')+`<div class="bar"><input id="s" placeholder="🔍 Search" value="${esc(q)}">${c.noadd?'':`<button class="btn" id="add">+ ${c.add}</button>`}</div><div class="panel"><div class="tw" id="tb"></div></div>`;
 $('#s').oninput=e=>{q=e.target.value;tbl()};if(!c.noadd)$('#add').onclick=()=>cform(k);tbl()}
function tbl(){const c=CFG[CK],src=c.src||CK,l=S[src].filter(r=>c.text(r).toLowerCase().includes(q.toLowerCase())).sort(c.sort);
 $('#tb').innerHTML=`<table><tr>${c.cols.map(x=>`<th>${x[0]}</th>`).join('')}<th></th></tr>${l.map(r=>`<tr>${c.cols.map(x=>`<td>${x[1](r)}</td>`).join('')}<td class="r">${(c.acts||[]).map((a,i)=>`<button class="btn sm sec" data-a="${i}" data-id="${r.id}">${a[0]}</button> `).join('')}<button class="btn sm sec" data-e="${r.id}">${c.edit||'Edit'}</button>${c.nodel?'':` <button class="btn sm dan" data-d="${r.id}">Delete</button>`}</td></tr>`).join('')||`<tr><td colspan="${c.cols.length+1}">Nothing here yet.</td></tr>`}</table>`;
 $('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=S[src].find(x=>x.id==(b.dataset.id||b.dataset.e||b.dataset.d));if(!r)return;
  if(b.dataset.a!==undefined){if(c.acts[b.dataset.a][1](r)!==true){save();tbl()}}
  else if(b.dataset.e)cform(CK,r);
  else modal(`<h3>Delete this pet?</h3><p>Its appointments will be removed too. This cannot be undone.</p>`,()=>{S.pets=S.pets.filter(x=>x!==r);S.appt=S.appt.filter(x=>x.pet!=r.id);save();tbl()},'Delete')}}
function cform(k,r){const c=CFG[k],src=c.src||k,v=r?(c.pre?c.pre(r):r):c.def();
 const inp=f=>{const [key,l,t,o]=f,val=v[key]??'';
  if(t==='select'){const op=typeof o==='function'?o(v):o;return`<label>${l}</label><select id="cf_${key}">${op.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(val)?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`}
  if(t==='checks'){const op=typeof o==='function'?o(v):o,sel=Array.isArray(val)?val:[];return`<label>${l}</label><div id="cf_${key}" class="chk">${op.map(x=>`<label><input type="checkbox" value="${esc(x[0])}" ${sel.includes(x[0])?'checked':''}> ${esc(x[1])}</label>`).join('')||'<small>No options yet.</small>'}</div>`}
  return`<label>${l}</label><input id="cf_${key}" type="${t}" ${t==='number'?'min="0" step="any"':''} value="${esc(val)}">`};
 const ov=modal(`<h3>${c.mt&&r?c.mt(r):(r?'Edit':'Add')+' '+(k==='appt'?'appointment':'pet')}</h3>${c.fields.map(inp).join('')}`,o=>{const d={};for(const f of c.fields){let x;
  if(f[2]==='checks'){x=[...o.querySelectorAll('#cf_'+f[0]+' input:checked')].map(i=>i.value);if(f[4]&&!x.length)return toast('Pick at least one: '+f[1]),false}
  else{x=o.querySelector('#cf_'+f[0]).value;if(f[4]&&!x.trim())return toast('Please fill in: '+f[1]),false;if(f[5]||f[2]==='number')x=x===''?'':+x}
  d[f[0]]=x}
  if(d.until&&d.until<d.date)return toast('Check-out must be on or after the appointment date'),false;
  if(c.post)c.post(d);r?Object.assign(r,d):S[src].push({id:nid(src),...d});save();tbl()});
 if(c.after)c.after(ov)}
function migrate(){
 if(!S.pets){S.pets=[{id:1,name:'Bantay',species:'Dog',breed:'Aspin',oname:'Maria Santos',tel:'0917 123 4567',member:1,vax:['Rabies','5-in-1 (DHPP)']},{id:2,name:'Mingming',species:'Cat',breed:'Puspin',oname:'Juan Dela Cruz',tel:'0928 765 4321',member:2,vax:['FVRCP (3-in-1 cat)']}];
  S.appt=[{id:1,pet:1,services:['Full Grooming'],date:today(),time:'10:00',until:'',status:'Scheduled',notes:''},{id:2,pet:2,services:['Pet Boarding (per day)'],date:dOff(1),time:'09:00',until:dOff(3),status:'Scheduled',notes:''}]}
 S.pets.forEach(p=>{if(p.oname===undefined){const m=S.members.find(x=>x.id==p.owner);p.oname=m?m.name:'';p.tel=m?m.tel:'';p.member=m?m.id:''}if(!p.vax)p.vax=[]});
 (S.vax||[]).forEach(v=>{const p=S.pets.find(x=>x.id==v.pet);if(p&&!p.vax.includes(v.vaccine))p.vax.push(v.vaccine)});
 delete S.vax;delete S.groom;delete S.sched;delete S.board;
 S.appt=(S.appt||[]).map(a=>a.services?a:{id:a.id,pet:a.pet,services:a.service?[a.service]:[],date:a.date,time:a.time,until:'',status:a.status,notes:a.notes||''});
 if(!S.products.some(p=>p.cat==='Boarding'))S.products.push({id:S.nid.p++,name:'Pet Boarding (per day)',cat:'Boarding',em:'🏠',price:350,cost:100,stock:null});
 save()}
migrate();
boot();
</script></body></html>
